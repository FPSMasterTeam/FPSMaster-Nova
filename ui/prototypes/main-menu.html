<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova 原型 — 主界面</title>
<link rel="stylesheet" href="fpsmaster-ui.css">
<style>
  /* Nova 身份: 左侧字标 + 玻璃按钮柱 (相对 Edge 底部磁贴坞) */
  .acct-zone { position: fixed; top: 22px; left: 28px; z-index: 20; }
  .user-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px 8px 8px; border-radius: var(--r-pill); cursor: pointer;
  }
  .acct-zone:hover .user-chip { border-color: var(--stroke-strong); }
  .avatar { width: 28px; height: 28px; border-radius: 8px; flex: none; background: linear-gradient(135deg, #7d8dff, #4a3f9e); }
  .user-chip .name { font: 600 13.5px/1.2 var(--font); }
  .user-chip .sub { font: 400 11px/1.2 var(--font); color: var(--text-2); }
  .user-chip .chev { color: var(--text-3); margin-left: 2px; transition: transform 0.18s; }
  .user-chip .chev svg.i { width: 13px; height: 13px; }
  .acct-zone:hover .chev { transform: rotate(180deg); }
  .acct-pop {
    position: absolute; top: calc(100% + 8px); left: 0; width: 248px; padding: 6px;
    opacity: 0; transform: translateY(-6px); pointer-events: none;
    transition: opacity 0.16s, transform 0.16s;
  }
  .acct-pop::before { content: ""; position: absolute; top: -10px; left: 0; right: 0; height: 10px; }
  .acct-zone:hover .acct-pop { opacity: 1; transform: none; pointer-events: auto; }
  .acct { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .acct:hover { background: var(--layer-hover); }
  .acct .n { font: 500 13px/1.25 var(--font); }
  .acct .t { font: 400 10.5px/1.3 var(--font); color: var(--text-3); display: flex; align-items: center; gap: 5px; }
  .acct .on-mark { color: var(--accent-text); margin-left: auto; }
  .acct .on-mark svg.i { width: 14px; height: 14px; }
  .acct.add { color: var(--text-2); }
  .acct.add .plus {
    width: 28px; height: 28px; border-radius: 8px; border: 1px dashed var(--stroke-strong);
    display: flex; align-items: center; justify-content: center;
  }
  .acct.add .plus svg.i { width: 14px; height: 14px; }
  .mslogo { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5px; width: 14px; height: 14px; }
  .mslogo i { background: #f25022; } .mslogo i:nth-child(2) { background: #7fba00; }
  .mslogo i:nth-child(3) { background: #00a4ef; } .mslogo i:nth-child(4) { background: #ffb900; }

  .top-actions { position: fixed; top: 22px; right: 24px; display: flex; gap: 8px; }
  .top-actions .btn { border-radius: var(--r-pill); width: 38px; height: 38px; }

  .rail {
    position: fixed; left: 0; top: 0; bottom: 0;
    width: min(420px, 46vw);
    display: flex; flex-direction: column; justify-content: center;
    padding: 96px 40px 56px 48px;
    background: linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.28) 70%, transparent 100%);
  }
  .hero .greet { font: 500 13px/1 var(--font); color: var(--text-2); }
  .hero .logo { margin-top: 10px; font: 800 56px/1 var(--font); letter-spacing: 0.02em; }
  .hero .edition {
    margin-top: 10px; display: inline-flex; align-items: center; gap: 10px;
    font: 600 12px/1 var(--font); letter-spacing: 0.38em; color: var(--accent-text); text-transform: uppercase;
  }
  .hero .edition::after { content: ""; width: 48px; height: 1px; background: linear-gradient(90deg, var(--accent), transparent); }
  .hero .tag { margin-top: 10px; font: 400 13px/1.5 var(--font); color: var(--text-2); max-width: 280px; }

  .menu { margin-top: 32px; display: flex; flex-direction: column; gap: 8px; width: 280px; }
  .menu-btn {
    position: relative; display: flex; align-items: center; gap: 12px;
    height: 46px; padding: 0 16px; overflow: hidden;
    border-radius: var(--r-card); background: var(--glass);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    border: 1px solid var(--stroke); color: var(--text);
    font: 500 14px/1 var(--font); cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .menu-btn::before {
    content: ""; position: absolute; left: 0; top: 22%; bottom: 22%; width: 3px;
    border-radius: 2px; background: var(--accent); opacity: 0;
    transition: opacity 0.15s, top 0.15s, bottom 0.15s;
  }
  .menu-btn:hover { background: rgba(28,28,28,.9); border-color: var(--stroke-strong); transform: translateX(4px); }
  .menu-btn:hover::before { opacity: 1; top: 14%; bottom: 14%; }
  .menu-btn .ic { color: var(--text-2); }
  .menu-btn .ic svg.i { width: 18px; height: 18px; stroke-width: 1.8; }
  .menu-btn:hover .ic { color: var(--accent-text); }
  .menu-btn.primary { border-color: rgba(89,101,241,.35); background: rgba(89,101,241,.12); }
  .menu-btn.danger { color: var(--text-2); }
  .menu-btn.danger:hover { color: var(--danger); }
  .menu-btn.danger:hover::before { background: var(--danger); }
  .menu-btn .hint { margin-left: auto; font: 400 11px/1 var(--font); color: var(--text-3); }

  .footer {
    position: absolute; bottom: 24px; left: 48px;
    font: 400 11px/1 var(--font); color: var(--text-3); letter-spacing: 0.08em;
  }
</style>
</head>
<body>
<div class="mc-world"></div>

<div class="acct-zone">
  <div class="user-chip glass">
    <div class="avatar"></div>
    <div>
      <div class="name">Steve</div>
      <div class="sub">微软账户</div>
    </div>
    <span class="chev"><svg class="i"><use href="#i-chev-d"/></svg></span>
  </div>
  <div class="acct-pop glass">
    <div class="acct">
      <div class="avatar"></div>
      <div class="meta">
        <div class="n">Steve</div>
        <div class="t"><span class="mslogo"><i></i><i></i><i></i><i></i></span>微软账户</div>
      </div>
      <span class="on-mark"><svg class="i"><use href="#i-check"/></svg></span>
    </div>
    <div class="acct">
      <div class="avatar" style="background:linear-gradient(135deg,#57c76c,#1e6c3c)"></div>
      <div class="meta">
        <div class="n">Alex_2333</div>
        <div class="t"><svg class="i" style="width:11px;height:11px"><use href="#i-cloud-off"/></svg>离线账户</div>
      </div>
    </div>
    <div class="hr"></div>
    <div class="acct add">
      <span class="plus"><svg class="i"><use href="#i-plus"/></svg></span>
      <div class="meta"><div class="n">添加账户</div></div>
    </div>
  </div>
</div>

<div class="top-actions">
  <button class="btn icon" title="背景"><svg class="i"><use href="#i-image"/></svg></button>
</div>

<div class="rail">
  <div class="hero">
    <div class="greet">下午好，Steve</div>
    <div class="logo">Nova</div>
    <div class="edition">FPSMaster</div>
    <div class="tag">现代版本客户端 · 同一套设计语言</div>
  </div>
  <div class="menu">
    <button class="menu-btn primary">
      <span class="ic"><svg class="i"><use href="#i-play"/></svg></span>单人游戏
    </button>
    <button class="menu-btn">
      <span class="ic"><svg class="i"><use href="#i-globe"/></svg></span>多人游戏
      <span class="hint">Hypixel</span>
    </button>
    <button class="menu-btn">
      <span class="ic"><svg class="i"><use href="#i-grid"/></svg></span>客户端设置
    </button>
    <button class="menu-btn">
      <span class="ic"><svg class="i"><use href="#i-sliders"/></svg></span>游戏选项
    </button>
    <button class="menu-btn danger">
      <span class="ic"><svg class="i"><use href="#i-power"/></svg></span>退出
    </button>
  </div>
  <div class="footer">FPSMaster Nova · 1.21</div>
</div>

<script src="icons.js"></script>
</body>
</html>
