# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
# Fabric Properties
# check these on https://modmuss50.me/fabric.html
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.4
loader_version=0.19.3
kotlin_loader_version=1.13.12+kotlin.2.4.0
# Local/dev default. Published versions come from git tags (same scheme as Edge):
#   v1.0.0         -> release / 1.0.0
#   v1.0.0-beta.1  -> beta    / 1.0.0-beta.1
# Modrinth per-MC: {version}+{minecraft} e.g. 1.0.0-beta.1+1.21.1
#
# Keep the semver core at or above the latest published tag. Besides the dev window title, CI derives
# branch-build versions from this value (ci-release.yml: <core>-ci.<run>+<sha>), so a stale core makes
# branch builds look older than what is already released. Latest published: v1.0.2-beta.1.
mod_version=1.0.3-beta
maven_group=top.fpsmaster
archives_base_name=nova
