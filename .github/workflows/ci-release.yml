name: Nova CI Release

on:
  pull_request:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  PRODUCT_CODE: nova
  ARTIFACT_SOURCE_TYPE: external_url

jobs:
  # Stage 1 — resolve the release channel and decide whether to build/publish. Runs once and
  # feeds the per-version build matrix and the aggregate publish job below.
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decision.outputs.should_publish }}
      should_build: ${{ steps.decision.outputs.should_build }}
      channel: ${{ steps.channel.outputs.channel }}
      version_name: ${{ steps.meta.outputs.version_name }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
      changelog: ${{ steps.meta.outputs.changelog }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          # Publish only from semver tags:
          #   v1.0.0           -> release / 1.0.0
          #   v1.0.0-beta.1    -> beta    / 1.0.0-beta.1
          channel=""
          should_publish="false"

          # Publish exclusively from version tags (branch pushes only build).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version_name="${GITHUB_REF_NAME#v}"
            if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "Invalid version tag: ${GITHUB_REF_NAME} (expected vMAJOR.MINOR.PATCH[-prerelease])" >&2
              exit 1
            fi
            if [[ "$version_name" == *-* ]]; then
              channel="beta"
            else
              channel="release"
            fi
            should_publish="true"
          fi

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            should_publish="false"
          fi

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

      - name: Finalize build decision
        id: decision
        shell: bash
        run: |
          echo "should_build=true" >> "$GITHUB_OUTPUT"
          echo "should_publish=${{ steps.channel.outputs.should_publish }}" >> "$GITHUB_OUTPUT"

      - name: Capture shared metadata
        id: meta
        shell: bash
        run: |
          commit_hash="${GITHUB_SHA}"
          short_sha="$(printf '%s' "$commit_hash" | cut -c1-8 | tr '[:upper:]' '[:lower:]')"
          channel="${{ steps.channel.outputs.channel }}"
          should_publish="${{ steps.channel.outputs.should_publish }}"

          if [ "$should_publish" = "true" ]; then
            version_name="${GITHUB_REF_NAME#v}"
            release_tag="${GITHUB_REF_NAME}"
          else
            base="$(grep -E '^[[:space:]]*mod_version[[:space:]]*=' gradle.properties | head -n1 | sed -E 's/^[^=]+=//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^["'\'']//; s/["'\'']$//')"
            core="$(printf '%s' "$base" | sed -E 's/^v//; s/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
            if [ -z "$core" ]; then
              echo "Could not parse semver core from mod_version='$base'" >&2
              exit 1
            fi
            version_name="${core}-ci.${GITHUB_RUN_NUMBER}+${short_sha}"
            release_tag="nova-${version_name}"
          fi

          {
            echo "commit_hash=$commit_hash"
            echo "version_name=$version_name"
            echo "release_tag=$release_tag"
          } >> "$GITHUB_OUTPUT"

          {
            echo "changelog<<EOF"
            git log -1 --pretty=format:'%s%n%n%b'
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved Nova version: $version_name (channel=${channel:-none}, publish=$should_publish)"

  # Stage 2 — build every Minecraft game version in parallel. Each leg produces one jar plus a
  # meta json the publish job consumes. fail-fast is off so one flaky version can't sink the rest.
  build:
    needs: decide
    if: needs.decide.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.19.2", jdk: "21", recommended: "false" }
          - { mc: "1.20.1", jdk: "21", recommended: "false" }
          - { mc: "1.21.1", jdk: "21", recommended: "false" }
          - { mc: "1.21.8", jdk: "21", recommended: "false" }
          - { mc: "1.21.11", jdk: "21", recommended: "true" }
          # 26.2 is Mojang's unobfuscated year-scheme build: ships Java 25 bytecode, so its Gradle
          # daemon must run on JDK 25 (build.gradle.kts already switches Loom/toolchain by version).
          - { mc: "26.2", jdk: "25", recommended: "false" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.jdk }}
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        shell: bash
        env:
          # Lets Gradle resolve the private mcef-nova artifact from GitHub Packages. Works once the
          # package grants read access to this repo; until then the vendor/maven fallback covers it.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.decide.outputs.version_name }}
        run: |
          chmod +x ./gradlew
          # Stamp computed semver into fabric.mod.json / Client.VERSION via gradle mod_version.
          ./gradlew ":${{ matrix.mc }}:build" -Pmod_version="$VERSION_NAME"

      - name: Capture artifact metadata
        id: meta
        shell: bash
        run: |
          mc="${{ matrix.mc }}"
          artifact_path="$(find "versions/${mc}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          if [ -z "$artifact_path" ]; then
            echo "No Nova jar artifact found in versions/${mc}/build/libs" >&2
            exit 1
          fi

          version_name="${{ needs.decide.outputs.version_name }}"
          version_safe="$(printf '%s' "$version_name" | tr '/ ' '--')"
          # Rename per game version so all jars can coexist in one GitHub Release without name clashes.
          asset_name="fpsmaster-nova-${mc}-${version_safe}.jar"
          mkdir -p staging
          cp "$artifact_path" "staging/${asset_name}"

          checksum="$(sha256sum "staging/${asset_name}" | awk '{print $1}')"
          file_size="$(stat -c%s "staging/${asset_name}")"

          cat > "staging/meta-${mc}.json" <<EOF
          {
            "gameVersion": "${mc}",
            "assetName": "${asset_name}",
            "checksum": "${checksum}",
            "fileSize": ${file_size},
            "recommended": ${{ matrix.recommended }}
          }
          EOF

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-build-${{ matrix.mc }}
          path: staging/*
          if-no-files-found: error

  # Stage 3 — collect every version's jar + meta, cut a single GitHub Release, then register each
  # game version with the backend release API (one /releases/ci per version, carrying gameVersion).
  publish:
    needs: [decide, build]
    # Publish whatever versions built. `always()` lets this run even when some matrix legs failed
    # (fail-fast is off), so one broken game version can't block releasing the others. Still gated on
    # the decision succeeding and the build job having actually run (not skipped/cancelled).
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.decide.outputs.should_publish == 'true' &&
      needs.decide.result == 'success' &&
      needs.build.result != 'skipped' &&
      needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-build-*
          path: dist
          merge-multiple: true

      - name: Report published versions
        shell: bash
        run: |
          echo "Jars present for release:"
          ls -1 dist/*.jar 2>/dev/null || echo "  (none)"
          echo "Per-version metadata present:"
          ls -1 dist/meta-*.json 2>/dev/null || echo "  (none)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Nova ${{ needs.decide.outputs.version_name }}
          body: ${{ needs.decide.outputs.changelog }}
          files: dist/*.jar
          fail_on_unmatched_files: true

      - name: Upload to Qiniu OSS and notify release API
        shell: bash
        env:
          FPSMASTER_CI_API_BASE_URL: ${{ secrets.FPSMASTER_CI_API_BASE_URL }}
          FPSMASTER_CI_UPLOAD_TOKEN: ${{ secrets.FPSMASTER_CI_UPLOAD_TOKEN }}
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_S3_ENDPOINT: ${{ secrets.QINIU_S3_ENDPOINT }}
          QINIU_S3_REGION: ${{ secrets.QINIU_S3_REGION }}
          QINIU_CDN_BASE_URL: ${{ secrets.QINIU_CDN_BASE_URL }}
          CHANNEL_CODE: ${{ needs.decide.outputs.channel }}
          VERSION_NAME: ${{ needs.decide.outputs.version_name }}
          COMMIT_HASH: ${{ needs.decide.outputs.commit_hash }}
          # Pass the changelog via env (never inline ${{ }} into bash) so commit messages containing
          # quotes/backticks can't break the shell.
          CHANGELOG: ${{ needs.decide.outputs.changelog }}
        run: |
          if [ -z "$FPSMASTER_CI_API_BASE_URL" ] || [ -z "$FPSMASTER_CI_UPLOAD_TOKEN" ]; then
            echo "Release API secrets are not configured" >&2
            exit 1
          fi
          if [ -z "$QINIU_ACCESS_KEY" ] || [ -z "$QINIU_SECRET_KEY" ] || [ -z "$QINIU_BUCKET" ] || [ -z "$QINIU_S3_ENDPOINT" ] || [ -z "$QINIU_CDN_BASE_URL" ]; then
            echo "Qiniu OSS secrets are not configured" >&2
            exit 1
          fi

          python3 -m pip install --quiet --user boto3

          changelog_json="$(printf '%s' "$CHANGELOG" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"

          shopt -s nullglob
          meta_files=(dist/meta-*.json)
          if [ ${#meta_files[@]} -eq 0 ]; then
            echo "No per-version meta files found in dist" >&2
            exit 1
          fi

          for meta in "${meta_files[@]}"; do
            game_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["gameVersion"])' "$meta")"
            asset_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["assetName"])' "$meta")"
            checksum="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["checksum"])' "$meta")"
            file_size="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fileSize"])' "$meta")"
            recommended="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["recommended"]).lower())' "$meta")"

            artifact_path="dist/${asset_name}"
            if [ ! -f "$artifact_path" ]; then
              echo "Missing jar for ${game_version}: ${artifact_path}" >&2
              exit 1
            fi

            object_key="nova/${CHANNEL_CODE}/${VERSION_NAME}/${COMMIT_HASH}/${game_version}/${asset_name}"
            echo "Uploading Nova ${game_version} (${asset_name}) -> ${object_key}"
            export ARTIFACT_PATH="$artifact_path" OBJECT_KEY="$object_key"
            download_url="$(python3 -c "import os,boto3; e=os.environ['QINIU_S3_ENDPOINT'].rstrip('/'); c=os.environ['QINIU_CDN_BASE_URL'].rstrip('/'); b=os.environ['QINIU_BUCKET']; k=os.environ['OBJECT_KEY']; p=os.environ['ARTIFACT_PATH']; client=boto3.client('s3', endpoint_url=e, aws_access_key_id=os.environ['QINIU_ACCESS_KEY'], aws_secret_access_key=os.environ['QINIU_SECRET_KEY'], region_name=os.environ.get('QINIU_S3_REGION') or 'ap-southeast-1'); client.upload_file(p,b,k); print(f'{c}/{k}')")"

            cat > payload.json <<EOF
          {
            "productCode": "${PRODUCT_CODE}",
            "channelCode": "${CHANNEL_CODE}",
            "versionName": "${VERSION_NAME}",
            "gameVersion": "${game_version}",
            "commitHash": "${COMMIT_HASH}",
            "artifactSourceType": "external_url",
            "downloadUrl": "${download_url}",
            "fileSize": ${file_size},
            "checksum": "${checksum}",
            "recommended": ${recommended},
            "mandatory": false,
            "changelog": ${changelog_json}
          }
          EOF

            curl --fail --show-error --silent \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-CI-Token: ${FPSMASTER_CI_UPLOAD_TOKEN}" \
              --data @payload.json \
              "${FPSMASTER_CI_API_BASE_URL%/}/api/v1/launcher/releases/ci"
          done

      - name: Publish to Modrinth
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
          CHANGELOG: ${{ needs.decide.outputs.changelog }}
          VERSION_NAME: ${{ needs.decide.outputs.version_name }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
          COMMIT_HASH: ${{ needs.decide.outputs.commit_hash }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN not configured; skipping Modrinth publish"
            exit 0
          fi

          project_id="${MODRINTH_PROJECT_ID:-EYsVyax4}"
          short_sha="$(printf '%s' "$COMMIT_HASH" | cut -c1-7)"
          case "$CHANNEL" in
            release) version_type="release" ;;
            beta)    version_type="beta" ;;
            *)
              echo "Unsupported channel for Modrinth: $CHANNEL" >&2
              exit 1
              ;;
          esac

          shopt -s nullglob
          meta_files=(dist/meta-*.json)
          if [ ${#meta_files[@]} -eq 0 ]; then
            echo "No per-version meta files found in dist" >&2
            exit 1
          fi

          for meta in "${meta_files[@]}"; do
            game_version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["gameVersion"])' "$meta")"
            asset_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["assetName"])' "$meta")"
            artifact_path="dist/${asset_name}"
            if [ ! -f "$artifact_path" ]; then
              echo "Missing jar for ${game_version}: ${artifact_path}" >&2
              exit 1
            fi

            # Unique + URL-safe, max 32 chars: semver + MC so multi-jar releases don't collide.
            gv_safe="$(printf '%s' "$game_version" | tr -cd 'A-Za-z0-9._-')"
            base_vn="$(printf '%s' "$VERSION_NAME" | tr -cd 'A-Za-z0-9._+-')"
            version_number="$(printf '%s+%s' "$base_vn" "$gv_safe" | cut -c1-32)"
            if [ -z "$version_number" ]; then
              version_number="$(printf 'n-%s-%s' "$gv_safe" "$short_sha" | cut -c1-32)"
            fi

            jq -n \
              --arg name "Nova ${VERSION_NAME} (${game_version})" \
              --arg version_number "$version_number" \
              --arg changelog "$CHANGELOG" \
              --arg game_version "$game_version" \
              --arg version_type "$version_type" \
              --arg project_id "$project_id" \
              '{
                name: $name,
                version_number: $version_number,
                changelog: $changelog,
                dependencies: [],
                game_versions: [$game_version],
                version_type: $version_type,
                loaders: ["fabric"],
                featured: ($version_type == "release"),
                project_id: $project_id,
                file_parts: ["file"],
                primary_file: "file"
              }' > modrinth-data.json

            echo "Publishing $artifact_path to Modrinth as $version_number ($game_version / fabric / $version_type)"
            curl --fail --show-error --silent \
              -X POST \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -F "data=@modrinth-data.json;type=application/json" \
              -F "file=@${artifact_path}" \
              "https://api.modrinth.com/v2/version" \
              | python -c 'import json,sys; v=json.load(sys.stdin); print("Modrinth version id:", v.get("id"), "https://modrinth.com/mod/fpsmaster/version/" + (v.get("id") or ""))'
          done

      - name: Publish to CurseForge
        continue-on-error: true
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CHANGELOG: ${{ needs.decide.outputs.changelog }}
          VERSION_NAME: ${{ needs.decide.outputs.version_name }}
          CHANNEL: ${{ needs.decide.outputs.channel }}
        run: |
          CURSEFORGE_TOKEN="$(printf '%s' "$CURSEFORGE_TOKEN" | tr -d '[:space:]')"
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "CURSEFORGE_TOKEN not configured; skipping CurseForge publish"
            exit 0
          fi
          if [[ "$CURSEFORGE_TOKEN" == \$2* ]] || [[ "$CURSEFORGE_TOKEN" == '$2'* ]]; then
            echo "::warning::CURSEFORGE_TOKEN looks like a bcrypt hash, not a CurseForge Upload API token; skipping"
            exit 0
          fi

          project_id="${CURSEFORGE_PROJECT_ID:-1081006}"
          case "$CHANNEL" in
            release) release_type="release" ;;
            beta)    release_type="beta" ;;
            *)
              echo "Unsupported channel for CurseForge: $CHANNEL" >&2
              exit 0
              ;;
          esac

          versions_body="$(mktemp)"
          versions_code="$(curl --silent --show-error \
            -H "X-Api-Token: ${CURSEFORGE_TOKEN}" \
            -o "$versions_body" -w '%{http_code}' \
            "https://minecraft.curseforge.com/api/game/versions" || true)"
          if [ "$versions_code" != "200" ]; then
            echo "::warning::CurseForge game/versions returned HTTP ${versions_code} (invalid Upload API token). Body:"
            head -c 500 "$versions_body" || true
            echo
            echo "Set a Console Upload API token: gh secret set CURSEFORGE_TOKEN -R FPSMasterTeam/FPSMaster-Nova"
            exit 0
          fi
          versions_json="$(cat "$versions_body")"

          shopt -s nullglob
          meta_files=(dist/meta-*.json)
          if [ ${#meta_files[@]} -eq 0 ]; then
            echo "No per-version meta files found in dist" >&2
            exit 1
          fi

          for meta in "${meta_files[@]}"; do
            game_version="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["gameVersion"])' "$meta")"
            asset_name="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["assetName"])' "$meta")"
            artifact_path="dist/${asset_name}"
            if [ ! -f "$artifact_path" ]; then
              echo "Missing jar for ${game_version}: ${artifact_path}" >&2
              exit 1
            fi

            set +e
            game_version_ids="$(printf '%s' "$versions_json" | jq -r --arg mc "$game_version" '
              [
                .[]
                | select(
                    (.name // "") == $mc
                    or (.name // "") == "Fabric"
                    or (.name // "") == ("Minecraft " + $mc)
                    or (
                      ((.name // "") | endswith($mc))
                      and ((.name // "") | contains("Fabric") | not)
                      and ((.name // "") | contains("Forge") | not)
                      and ((.name // "") | contains("Quilt") | not)
                    )
                  )
                | .id
              ]
              | unique | sort | @csv' | tr -d '"')"
            resolve_rc=0
            if [ -z "$game_version_ids" ]; then
              resolve_rc=2
            else
              fabric_id="$(printf '%s' "$versions_json" | jq -r '.[] | select((.name // "") == "Fabric") | .id' | head -n 1)"
              if [ -z "$fabric_id" ] || ! printf '%s' ",${game_version_ids}," | grep -q ",${fabric_id},"; then
                resolve_rc=2
              fi
            fi
            set -e
            if [ "$resolve_rc" -eq 2 ]; then
              echo "Skipping CurseForge upload for ${game_version} (no matching game version IDs)"
              continue
            fi

            gv_json="[${game_version_ids}]"
            echo "Resolved CurseForge gameVersions for ${game_version}: ${gv_json}"

            jq -n \
              --arg changelog "${CHANGELOG:-Nova ${VERSION_NAME}}" \
              --arg displayName "Nova ${VERSION_NAME} (${game_version})" \
              --arg releaseType "$release_type" \
              --argjson gameVersions "$gv_json" \
              '{
                changelog: $changelog,
                changelogType: "markdown",
                displayName: $displayName,
                gameVersions: $gameVersions,
                releaseType: $releaseType
              }' > curseforge-metadata.json

            echo "Publishing $artifact_path to CurseForge project $project_id ($game_version / $release_type)"
            curl --fail --show-error --silent \
              -X POST \
              -H "X-Api-Token: ${CURSEFORGE_TOKEN}" \
              -F "metadata=<curseforge-metadata.json;type=application/json" \
              -F "file=@${artifact_path}" \
              "https://minecraft.curseforge.com/api/projects/${project_id}/upload-file" \
              | python -c 'import json,sys; r=json.load(sys.stdin); print("CurseForge file id:", r.get("id"))'
          done
